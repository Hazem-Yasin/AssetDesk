name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore AssetDesk.sln
      - run: dotnet build AssetDesk.sln -c Release --no-restore
      - run: dotnet test AssetDesk.sln -c Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-test-results
          path: TestResults

  mysql-integration:
    name: API tests against real MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-password
          MYSQL_DATABASE: assetdesk_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pci-password --silent"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      ASSETDESK_TEST_MYSQL: Server=127.0.0.1;Port=3306;Database=assetdesk_test;User=root;Password=ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test AssetDesk.sln -c Release

  web:
    name: React build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t assetdesk:ci .
